# Connection comes from the same PG* environment variables psql uses, so the
# pipeline script, CI and a local shell all point dbt at the same database.
pokeplan:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'pokeplan') }}"
      schema: public
      threads: 4
