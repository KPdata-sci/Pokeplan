<svg viewBox="0 0 975 560" role="img" aria-label="A VPC across two availability zones with public, private app and private data subnets. Analysts reach Metabase through WAF and a load balancer. ECS tasks reach the internet only through Network Firewall and NAT, which allow just pokeapi.co and github.com. AWS services are reached privately through VPC endpoints. RDS sits in subnets with no route out." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
      <defs>
        <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="head"/></marker>
      </defs>
      <!-- internet column -->
      <text class="lane" x="20" y="40">INTERNET</text>
      <rect class="box" x="20" y="70" width="150" height="56" rx="5"/><text class="t" x="95" y="94" text-anchor="middle">Analysts</text><text class="s" x="95" y="112" text-anchor="middle">SSO sign-in</text>
      <text class="s" x="95" y="146" text-anchor="middle">HTTPS through WAF</text>
      <rect class="box" x="20" y="200" width="150" height="56" rx="5"/><text class="t" x="95" y="224" text-anchor="middle">pokeapi.co</text><text class="s" x="95" y="242" text-anchor="middle">github.com</text>
      <text class="s" x="95" y="276" text-anchor="middle">only allowed egress</text>

      <!-- region + vpc -->
      <rect class="frame" x="190" y="12" width="775" height="538" rx="8"/>
      <text class="lane" x="204" y="32">ACCOUNT pokeplan-prod · eu-west-2</text>
      <rect class="frame" x="210" y="44" width="510" height="494" rx="6"/>
      <text class="lane" x="224" y="64">VPC 10.40.0.0/16</text>
      <rect class="frame-d" x="225" y="74" width="240" height="456" rx="4"/><text class="s" x="345" y="92" text-anchor="middle">eu-west-2a</text>
      <rect class="frame-d" x="475" y="74" width="230" height="456" rx="4"/><text class="s" x="590" y="92" text-anchor="middle">eu-west-2b</text>

      <!-- public -->
      <rect class="subnet" x="235" y="100" width="220" height="136" rx="4"/><rect class="subnet" x="485" y="100" width="210" height="136" rx="4"/>
      <text class="s" x="243" y="116">public</text><text class="s" x="493" y="116">public</text>
      <rect class="box" x="250" y="124" width="430" height="38" rx="5"/><text class="t" x="465" y="148" text-anchor="middle">Application Load Balancer + WAF</text>
      <rect class="box" x="245" y="178" width="120" height="48" rx="5"/><text class="t" x="305" y="198" text-anchor="middle">Firewall</text><text class="s" x="305" y="215" text-anchor="middle">+ NAT gateway</text>
      <rect class="box" x="495" y="178" width="120" height="48" rx="5"/><text class="t" x="555" y="198" text-anchor="middle">Firewall</text><text class="s" x="555" y="215" text-anchor="middle">+ NAT gateway</text>

      <!-- private app -->
      <rect class="subnet" x="235" y="252" width="220" height="128" rx="4"/><rect class="subnet" x="485" y="252" width="210" height="128" rx="4"/>
      <text class="s" x="243" y="372">private app</text><text class="s" x="493" y="372">private app</text>
      <rect class="box" x="250" y="282" width="190" height="62" rx="5"/><text class="t" x="345" y="307" text-anchor="middle">ECS Fargate</text><text class="s" x="345" y="326" text-anchor="middle">Dagster · dlt · Metabase</text>
      <rect class="box" x="500" y="282" width="180" height="62" rx="5"/><text class="t" x="590" y="307" text-anchor="middle">ECS Fargate</text><text class="s" x="590" y="326" text-anchor="middle">Dagster · dlt · Metabase</text>

      <!-- private data -->
      <rect class="subnet" x="235" y="396" width="220" height="124" rx="4"/><rect class="subnet" x="485" y="396" width="210" height="124" rx="4"/>
      <text class="s" x="243" y="512">private data · no route out</text><text class="s" x="493" y="512">private data · no route out</text>
      <rect class="box" x="250" y="426" width="190" height="62" rx="5"/><text class="t" x="345" y="451" text-anchor="middle">RDS Postgres</text><text class="s" x="345" y="470" text-anchor="middle">Dagster + Metabase state</text>
      <rect class="box" x="500" y="426" width="180" height="62" rx="5"/><text class="t" x="590" y="451" text-anchor="middle">RDS standby</text><text class="s" x="590" y="470" text-anchor="middle">Multi-AZ</text>
      <line class="rep" x1="440" y1="457" x2="500" y2="457"/>

      <!-- services -->
      <rect class="box" x="740" y="232" width="210" height="164" rx="5"/>
      <text class="t" x="756" y="256">AWS services</text>
      <text class="s" x="756" y="274">via VPC endpoints, no internet</text>
      <text x="756" y="300">S3 · Athena · Glue</text>
      <text x="756" y="322">Lake Formation</text>
      <text x="756" y="344">SQS · EventBridge · SNS</text>
      <text x="756" y="366">Secrets Manager · KMS</text>
      <text x="756" y="388">ECR · CloudWatch Logs</text>

      <!-- arrows -->
      <line class="ar" x1="170" y1="104" x2="248" y2="138" marker-end="url(#b)"/>
      <line class="ar" x1="420" y1="162" x2="420" y2="280" marker-end="url(#b)"/>
      <line class="ar" x1="660" y1="162" x2="660" y2="280" marker-end="url(#b)"/>
      <line class="ar" x1="305" y1="282" x2="305" y2="228" marker-end="url(#b)"/>
      <line class="ar" x1="555" y1="282" x2="555" y2="228" marker-end="url(#b)"/>
      <line class="ar" x1="245" y1="206" x2="172" y2="226" marker-end="url(#b)"/>
      <line class="ar" x1="345" y1="344" x2="345" y2="424" marker-end="url(#b)"/><text class="s" x="353" y="390">5432</text>
      <line class="ar" x1="680" y1="313" x2="738" y2="313" marker-end="url(#b)"/>
    </svg>